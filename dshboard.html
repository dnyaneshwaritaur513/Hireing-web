<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body{
      font-family:Arial;
      background:#f4f4f4;
      margin:0;
    }

    .navbar{
      background:#1a1a2e;
      color:white;
      padding:15px;
      font-size:22px;
    }

    .container{
      padding:30px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .card{
      background:white;
      padding:25px;
      border-radius:10px;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
    }

    .card h2{
      margin:0;
      color:#1a1a2e;
    }
  </style>
</head>
<body>

<div class="navbar">
  HireFlow Dashboard
</div>

<div class="container">

  <div class="cards">

    <div class="card">
      <h2>247</h2>
      <p>Total Students</p>
    </div>

    <div class="card">
      <h2>42</h2>
      <p>Companies</p>
    </div>

    <div class="card">
      <h2>18</h2>
      <p>Open Jobs</p>
    </div>

  </div>

</div>

</body>
</html>
