<!DOCTYPE html>
<html>
<head>
  <title>Student Portal</title>

  <style>
    body{
      font-family:Arial;
      background:#f4f4f4;
      margin:0;
    }

    .header{
      background:#1a1a2e;
      color:white;
      padding:15px;
      font-size:22px;
    }

    .container{
      padding:30px;
    }

    .job-card{
      background:white;
      padding:20px;
      border-radius:10px;
      margin-bottom:20px;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
    }

    button{
      padding:10px 15px;
      background:#1a1a2e;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="header">
  Student Portal
</div>

<div class="container">

  <div class="job-card">
    <h2>Frontend Developer</h2>
    <p>Company: Infosys</p>
    <p>Package: 6 LPA</p>

    <button>Apply Now</button>
  </div>

  <div class="job-card">
    <h2>Backend Developer</h2>
    <p>Company: TCS</p>
    <p>Package: 5 LPA</p>

    <button>Apply Now</button>
  </div>

</div>

</body>
</html>
