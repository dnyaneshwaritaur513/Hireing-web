<!DOCTYPE html>
<html>
<head>
  <title>TPO Officer Portal</title>

  <style>
    body{
      font-family:Arial;
      margin:0;
      background:#f5f5f5;
    }

    .sidebar{
      width:220px;
      height:100vh;
      background:#1a1a2e;
      color:white;
      position:fixed;
      padding:20px;
    }

    .sidebar h2{
      margin-bottom:30px;
    }

    .sidebar p{
      margin:15px 0;
      cursor:pointer;
    }

    .main{
      margin-left:240px;
      padding:30px;
    }

    .box{
      background:white;
      padding:20px;
      border-radius:10px;
      margin-bottom:20px;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>HireFlow</h2>

  <p>Dashboard</p>
  <p>Manage Students</p>
  <p>Manage Companies</p>
  <p>Placement Reports</p>
</div>

<div class="main">

  <div class="box">
    <h3>Total Placed Students</h3>
    <h1>120</h1>
  </div>

  <div class="box">
    <h3>Upcoming Companies</h3>

    <ul>
      <li>Infosys</li>
      <li>TCS</li>
      <li>Wipro</li>
    </ul>
  </div>

</div>

</body>
</html>
